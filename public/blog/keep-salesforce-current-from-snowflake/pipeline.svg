<svg xmlns="http://www.w3.org/2000/svg" width="920" height="740" viewBox="0 0 920 740" role="img" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Keeping Salesforce current from Snowflake with lht</title>
  <desc>Source data lands in the STG schema; lht syncs Salesforce objects into the SALESFORCE schema; a dynamic table in INT joins them; a stream on the dynamic table captures changes into FINAL.ACCOUNT_RESULTS; lht reverse-ETLs only the new rows back into Salesforce.</desc>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="920" height="740" fill="#FFFFFF"/>

  <rect x="60" y="130" width="800" height="480" rx="16" fill="#F3FAF7" stroke="#9FE1CB" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="84" y="158" font-size="15" font-weight="600" fill="#0F6E56">Snowflake</text>

  <g>
    <rect x="100" y="30" width="260" height="64" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="230" y="56" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">Source systems</text>
    <text x="230" y="78" text-anchor="middle" font-size="13" fill="#5F5E5A">ERP, billing, files, APIs</text>
  </g>
  <g>
    <rect x="560" y="30" width="260" height="64" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="690" y="56" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">Salesforce</text>
    <text x="690" y="78" text-anchor="middle" font-size="13" fill="#5F5E5A">Account, Contact, RecordType</text>
  </g>

  <g>
    <rect x="100" y="175" width="260" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75"/>
    <text x="230" y="201" text-anchor="middle" font-size="15" font-weight="600" fill="#04342C">STG schema</text>
    <text x="230" y="223" text-anchor="middle" font-size="13" fill="#0F6E56">Raw data as loaded (bronze)</text>
  </g>
  <g>
    <rect x="560" y="175" width="260" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75"/>
    <text x="690" y="201" text-anchor="middle" font-size="15" font-weight="600" fill="#04342C">SALESFORCE schema</text>
    <text x="690" y="223" text-anchor="middle" font-size="13" fill="#0F6E56">Synced sObjects with their Ids</text>
  </g>
  <g>
    <rect x="280" y="290" width="360" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75"/>
    <text x="460" y="316" text-anchor="middle" font-size="15" font-weight="600" fill="#04342C">INT schema: dynamic table</text>
    <text x="460" y="338" text-anchor="middle" font-size="13" fill="#0F6E56">Joins STG rows to Salesforce Ids (silver)</text>
  </g>
  <g>
    <rect x="280" y="400" width="360" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75"/>
    <text x="460" y="426" text-anchor="middle" font-size="15" font-weight="600" fill="#04342C">Stream on the dynamic table</text>
    <text x="460" y="448" text-anchor="middle" font-size="13" fill="#0F6E56">Captures inserts, updates, deletes</text>
  </g>
  <g>
    <rect x="280" y="510" width="360" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75"/>
    <text x="460" y="536" text-anchor="middle" font-size="15" font-weight="600" fill="#04342C">FINAL.ACCOUNT_RESULTS</text>
    <text x="460" y="558" text-anchor="middle" font-size="13" fill="#0F6E56">Changes kept for reporting (gold)</text>
  </g>
  <g>
    <rect x="280" y="650" width="360" height="64" rx="8" fill="#FAEEDA" stroke="#BA7517"/>
    <text x="460" y="676" text-anchor="middle" font-size="15" font-weight="600" fill="#412402">lht retl</text>
    <text x="460" y="698" text-anchor="middle" font-size="13" fill="#854F0B">Sends rows not yet sent</text>
  </g>

  <line x1="230" y1="94" x2="230" y2="171" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="242" y="118" font-size="13" fill="#5F5E5A">load</text>
  <line x1="690" y1="94" x2="690" y2="171" stroke="#BA7517" stroke-width="1.6" marker-end="url(#aa)"/>
  <text x="702" y="118" font-size="13" font-weight="600" fill="#854F0B">lht sync</text>

  <path d="M230 239 L230 265 L380 265 L380 286" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ag)"/>
  <path d="M690 239 L690 265 L540 265 L540 286" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="460" y1="354" x2="460" y2="396" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="460" y1="464" x2="460" y2="506" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="472" y="490" font-size="13" fill="#5F5E5A">changes only</text>
  <line x1="460" y1="574" x2="460" y2="646" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ag)"/>

  <path d="M640 682 L890 682 L890 62 L824 62" fill="none" stroke="#BA7517" stroke-width="1.8" marker-end="url(#aa)"/>
  <text x="660" y="672" font-size="13" font-weight="600" fill="#854F0B">Bulk API 2.0 upsert</text>
</svg>
